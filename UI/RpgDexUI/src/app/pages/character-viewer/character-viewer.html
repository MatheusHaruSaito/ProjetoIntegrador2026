<div class="cv-wrapper" *ngIf="character">
  <!-- Header / Perfil -->
  <div class="cv-header">
    <div class="cv-avatar" [style.background-image]="character.iconPath ? 'url(' + character.iconPath + ')' : ''">
      <i class="fa fa-shield-halved" *ngIf="!character.iconPath"></i>
    </div>
    <div class="cv-details">
      <h3 class="cv-name">{{ character.name }}</h3>
      <p class="cv-desc" *ngIf="character.description">{{ character.description }}</p>
    </div>
  </div>

  <!-- Conteúdo Dinâmico da Ficha -->
  <div class="cv-sheet-empty" *ngIf="getSheetColumns().length === 0">
    <i class="fa fa-circle-info"></i> Nenhum atributo registrado na ficha.
  </div>

  <div class="cv-sheet-grid" *ngIf="getSheetColumns().length > 0">
    <div class="cv-sheet-col" *ngFor="let col of getSheetColumns()">
      
      <div class="cv-scalar-badge" *ngIf="col.scalar !== undefined">
        <span class="cv-section-title">{{ col.key }}</span>
        <span class="cv-prop-val">{{ col.scalar }}</span>
      </div>

      <div class="cv-section-block" *ngFor="let section of col.sections">
        <h4 class="cv-section-title">{{ section.title }}</h4>
        <div class="cv-props-list">
          <div class="cv-prop-chip" *ngFor="let item of section.items">
            <span class="cv-prop-key">{{ item.name }}</span>
            <span class="cv-prop-val">{{ item.value }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
