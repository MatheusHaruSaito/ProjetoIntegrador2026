<div class="login-wrapper">
  <div class="login-card">
    <div class="login-side">
      <div class="login-logo" routerLink="/home">RPGDex</div>
      <div class="login-side__content">
        <h1 class="login-side__title">Bem-vindo de Volta!</h1>
        <p class="login-side__text">
          Acesse sua conta para continuar suas campanhas e gerenciar seus personagens.
        </p>
      </div>
      <div class="login-side__actions desktop-only">
        <span class="login-side__small">Ainda não tem conta?</span>
        <button class="btn-side" routerLink="/cadastro">CADASTRAR</button>
      </div>
    </div>

    <div class="login-main">
      <div class="login-header">
        <h2 class="login-main__title">Entrar</h2>
        <p class="login-main__sub">Entre com suas credenciais.</p>
      </div>

      <form class="login-form" (ngSubmit)="Login()">
        <div class="input-group">
          <i class="fa fa-envelope icon-field"></i>
          <input
            type="email"
            placeholder="Email"
            name="email"
            [(ngModel)]="authUserForm.email"
            autocomplete="username"
            required
          />
        </div>
        <span class="field-hint" *ngIf="emailInvalid">Informe um email válido.</span>

        <!-- Campo de Senha com Alternância de Visibilidade -->
        <div class="input-group">
          <i class="fa fa-lock icon-field"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Senha"
            name="password"
            [(ngModel)]="authUserForm.password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="password-toggle-btn"
            (click)="togglePasswordVisibility()"
            [aria-label]="showPassword ? 'Ocultar senha' : 'Exibir senha'"
          >
            <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>

        <div class="form-options">
          <a routerLink="/esqueci-senha" class="forgot-link">Esqueceu a senha?</a>
        </div>

        <div class="feedback-message error-message" *ngIf="errorMessage">
          <i class="fa fa-circle-exclamation"></i> {{ errorMessage }}
        </div>

        <button type="submit" class="btn-login" [disabled]="isLoading">
          <span *ngIf="!isLoading">ENTRAR</span>
          <span *ngIf="isLoading"><i class="fa fa-spinner fa-spin"></i> Entrando...</span>
        </button>
      </form>

      <div class="login-separator">
        <span>ou entre com</span>
      </div>

      <div class="social-logins">
        <button
          type="button"
          class="social-btn"
          (click)="loginComGoogle()"
          title="Entrar com Google"
        >
          <i class="fa-brands fa-google"></i>
        </button>
        <div id="google-btn" style="display: none; position: absolute"></div>

        <button
          type="button"
          (click)="onDiscordLogin()"
          class="social-btn"
          title="Entrar com Discord"
        >
          <i class="fa-brands fa-discord"></i>
        </button>
      </div>

      <p class="login-footer mobile-only">
        Novo por aqui? <a routerLink="/cadastro">Crie uma conta</a>
      </p>
    </div>
  </div>
</div>
