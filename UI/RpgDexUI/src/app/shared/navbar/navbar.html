<header class="site-header">
  <nav class="main-nav" aria-label="Navegação principal">
    <a class="logo" routerLink="/home" (click)="closeMenu()">RPGDex</a>

    <button
      type="button"
      class="menu-toggle"
      [class.active]="isMenuOpen"
      (click)="toggleMenu()"
      aria-label="Abrir menu de navegação"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-backdrop" [class.active]="isMenuOpen" (click)="closeMenu()"></div>

    <div class="nav-container" id="primary-navigation" [class.active]="isMenuOpen">
      <ul class="nav-links">
        <li><a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Início</a></li>

        <ng-container *ngIf="authService.isLoggedIn()">
          <li><a routerLink="/campanhas" routerLinkActive="active" (click)="closeMenu()">Jogar</a></li>
          <li><a routerLink="/biblioteca" routerLinkActive="active" (click)="closeMenu()">Biblioteca</a></li>
        </ng-container>
      </ul>

      <a
        class="user-profile user-profile--image"
        routerLink="/perfil"
        (click)="closeMenu()"
        aria-label="Meu perfil"
        *ngIf="authService.isLoggedIn() && userAvatarUrl"
      >
        <img class="user-profile__img" [src]="userAvatarUrl" alt="Foto de perfil">
      </a>

      <a
        class="user-profile"
        routerLink="/perfil"
        (click)="closeMenu()"
        aria-label="Meu perfil"
        *ngIf="authService.isLoggedIn() && !userAvatarUrl"
      >
        <i class="fa-solid fa-user"></i>
      </a>

      <div class="auth-buttons" *ngIf="!authService.isLoggedIn()">
        <a class="btn-login-nav" routerLink="/login" (click)="closeMenu()">Entrar</a>
        <a class="btn-register-nav" routerLink="/cadastro" (click)="closeMenu()">Cadastrar</a>
      </div>
    </div>
  </nav>
</header>
